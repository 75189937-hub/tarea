<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Centro Odontologico</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
		<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
    <nav class="nav pb-1 pt-1 mb-9">
        <div class="nav__contenedor contenedor">
            <div class="nav__contenedor__menuIcon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                <div class="nav__contenedor__menuIcon__circle"></div>
            </div>
            <img src="img/logo.png" alt="#" class="nav__contenedor--logo">
            <div class="nav__contenedor__menu">
                <a href="#" class="nav__contenedor__menu--link">Inicio</a>
                <a href="#" class="nav__contenedor__menu--link">Servicios</a>
                <a href="#" class="nav__contenedor__menu--link">Equipo</a>
                <a href="#" class="nav__contenedor__menu--link">Testimonios</a>
                <a href="#" class="nav__contenedor__menu--link">Contacto</a>
            </div>
            <div class="nav__contenedor__menucita">
                <a href="portal.html" class="nav__contenedor__menucita--cita">Volver</a>
            </div>
        </div>

    </nav>
    <section class="auth pt-9 pb-9 contenedor">
        <div class="auth__contenedor">
            <img src="img/logo.png" alt="#">
            <h1>Create tu cuenta</h1>
            
            <div class="auth__contenedor__sesion mt-3">
                <form action="">
                    <div class="formGroup">
						<label for="name">Nombre Completo</label>
						<input type="text" id="name" placeholder="Tu Nombre">
					</div>
					<div class="formGroup">
						<label for="email">Email</label>
						<input type="email" id="email" placeholder="you@example.com">
					</div>
					<div class="formGroup">
						<label for="password">Contraseña</label>
						<input type="password" id="password" placeholder="Tu Contraseña">
					</div>
                    <div class="formGroup">
						<label for="confirmpassword">Confirma Contraseña</label>
						<input type="password" id="confirmpassword" placeholder="Confirma Tu Contraseña">
					</div>
					<div class="formGroup">
						<button type="submit" class="btn btn--secondary">Crea tu Cuenta</button>
					</div>
				</form>
                
            </div>
        </div>
    </section>
    <script src="js/menu.js"></script>
</body>
</html>
